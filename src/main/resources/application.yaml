spring:
  application:
    name: ecommerce_api
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce-api
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  expiration: ${JWT_EXPIRATION}
  key: ${JWT_KEY}